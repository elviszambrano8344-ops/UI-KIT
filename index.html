<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Kit - Help Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Design System - Help Desk</h1>

    <h2>Botones</h2>

    <button class="btn-primario">Botón Primario</button>
    <button class="btn-secundario">Botón Secundario</button>
    <button class="btn-peligro">Botón Peligro</button>

    <h2>Formulario</h2>

    <input type="text" placeholder="Ingrese su nombre">

    <br><br>

    <select>
        <option>Seleccione una prioridad</option>
        <option>Alta</option>
        <option>Media</option>
        <option>Baja</option>
    </select>

    <h2>Tarjeta</h2>

    <div class="card">
        <h3>Ticket #001</h3>
        <p>Error al iniciar sesión en el sistema.</p>
    </div>

    <h2>Badges</h2>

    <span class="badge-alta">Alta</span>
    <span class="badge-media">Media</span>
    <span class="badge-baja">Baja</span>

</body>
</html>
